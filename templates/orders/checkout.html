{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Checkout</h1>

    <h3>Order Summary</h3>
    {% for item in cart %}
        <p>{{ item.product.name }} x {{ item.quantity }} = Rs. {{ item.total_price }}</p>
    {% endfor %}
    <h3>Total: Rs. {{ cart.get_total_price }}</h3>

    <form method="post">
        {% csrf_token %}
        <p>Full Name: <input type="text" name="full_name" required></p>
        <p>Address: <textarea name="address" required></textarea></p>
        <p>Phone: <input type="text" name="phone" required></p>
        <button type="submit">Place Order</button>
    </form>
</body>
</html>
