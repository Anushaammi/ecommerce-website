{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>My Store</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Products</h1>
    {% for product in products %}
        <div class="product-card">
            <h3>{{ product.name }}</h3>
            <p>Price: Rs. {{ product.price }}</p>
            <a href="/cart/add/{{ product.id }}/">Add to Cart</a>
        </div>
    {% endfor %}
</body>
</html>
